name: Git Hash Security Check

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-git-hash-security:
    name: Verify Full Git Commit Hashes
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v6

      - name: Check for short git hashes in package.json
        uses: Automattic/vip-actions/git-hash-security-check@c8022b66e78461df4f802b935dc0dbb8399f96bc
